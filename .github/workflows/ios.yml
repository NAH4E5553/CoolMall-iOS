name: iOS F0

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: F0 verification
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MALL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Record environment and select exact runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/verification
          {
            git rev-parse HEAD
            printf 'Source SHA: %s\n' "$MALL_SOURCE_SHA"
            sw_vers
            printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
            Scripts/check-toolchain.sh
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee .build/verification/environment.log
          MALL_SIMULATOR_ID=$(python3 Scripts/select-simulator.py --runtime-version 27.0)
          echo "MALL_SIMULATOR_ID=$MALL_SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Policy, format, boundaries, negative controls, builds and full Test Plan
        shell: bash
        run: Scripts/verify-local.sh
      - name: Retain evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ios-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/verification/*.log
            .build/verification/*/*.log
            .build/verification/*/Tests.*.json
            .build/verification/*/Tests.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record remaining minimum-system coverage
        if: ${{ always() }}
        shell: bash
        run: echo 'iOS 17 compatibility is pending a physical-device run; this workflow validates iOS 27.0.' >> "$GITHUB_STEP_SUMMARY"

  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Require every verification job to succeed
        env:
          MALL_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 Scripts/check-ci-results.py
