name: iOS Full Regression (Advisory)

# The blocking main gate is iOS F0's required tier. This workflow runs the
# complete regression separately and is intentionally advisory: its failure is
# visible but is not part of required-checks and does not block merges.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-full-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full regression (advisory)
    # Nightly/manual only; workflow-level concurrency already isolates it
    # from required. Do not repeat the same group at job level.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MALL_TEST_DIAGNOSTICS: never
      MALL_VERIFICATION_TIER: full
      MALL_DIFF_BASE: ${{ github.event.before }}
      MALL_DIFF_HEAD: ${{ github.sha }}
      MALL_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check test-support manifest
        run: python3 Scripts/check-test-support.py
      - name: Record environment and select exact runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/verification
          {
            git rev-parse HEAD
            printf 'Source SHA: %s\n' "$MALL_SOURCE_SHA"
            sw_vers
            printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
            Scripts/check-toolchain.sh
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee .build/verification/environment.log
          MALL_SIMULATOR_ID=$(python3 Scripts/select-simulator.py --runtime-version 27.0)
          echo "MALL_SIMULATOR_ID=$MALL_SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Validate full regression
        id: gates
        shell: bash
        run: Scripts/verify-local.sh
      - name: Summarize executed verification stages
        if: ${{ always() }}
        shell: bash
        run: |
          python3 Scripts/verification-timing.py report-all .build/verification >> "$GITHUB_STEP_SUMMARY"
          for report in .build/verification/*/verification-verdict.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          for log in .build/verification/*/tests.log; do
            if [ -f "$log" ]; then python3 Scripts/test-duration-summary.py "$log" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: "Full regression verdict: ${{ steps.gates.outputs.verification_status }}"
        if: ${{ always() }}
        shell: bash
        env:
          MALL_VERDICT: ${{ steps.gates.outputs.verification_status }}
        run: |
          case "$MALL_VERDICT" in
            core-passed|core-passed-with-deferred|failed) printf '%s\n' "$MALL_VERDICT" ;;
            *) echo 'Missing full-regression verdict'; exit 1 ;;
          esac
      - name: Retain advisory evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ios-full-advisory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/verification/*.log
            .build/verification/*/*.log
            .build/verification/*/stage-timings.json
            .build/verification/*/stage-timings.md
            .build/verification/*/Tests.*.json
            .build/verification/*/test-scope.json
            .build/verification/*/test-enumeration.json
            .build/verification/*/expected-tests.txt
            .build/verification/*/banner-audit.json
            .build/verification/*/native-results.json
            .build/verification/*/verification-verdict.json
            .build/verification/*/verification-verdict.md
            .build/verification/*/Tests.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record remaining minimum-system coverage
        if: ${{ always() }}
        shell: bash
        run: echo 'Advisory full regression; iOS 17 compatibility remains pending a physical-device run. This workflow validates iOS 27.0.' >> "$GITHUB_STEP_SUMMARY"
