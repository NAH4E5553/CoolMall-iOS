name: iOS F0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_verification: ${{ steps.scope.outputs.run_verification }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout complete diff history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify documentation, placeholders and implemented changes
        id: scope
        env:
          MALL_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MALL_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 Scripts/classify-ci-changes.py

  verify:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_verification == 'true' }}
    concurrency:
      group: mall-ui-runner
      cancel-in-progress: false
    name: F0 verification
    runs-on: xcode-27
    timeout-minutes: 120
    outputs:
      verification_status: ${{ steps.gates.outputs.verification_status }}
      deferred_count: ${{ steps.gates.outputs.deferred_count }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MALL_TEST_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.collect_diagnostics && 'on-failure' || 'never' }}
      # PR and main push use the blocking required tier. Scheduled/manual runs keep the full tier.
      MALL_VERIFICATION_TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'required' || 'full' }}
      MALL_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      MALL_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MALL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check test-support governance
        run: python3 Scripts/check-test-support.py
      - name: Record environment and select exact runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/verification
          {
            git rev-parse HEAD
            printf 'Source SHA: %s\n' "$MALL_SOURCE_SHA"
            sw_vers
            printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
            Scripts/check-toolchain.sh
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee .build/verification/environment.log
          MALL_SIMULATOR_ID=$(python3 Scripts/select-simulator.py --runtime-version 27.0)
          echo "MALL_SIMULATOR_ID=$MALL_SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Validate selected tier, builds, governance and exact native results
        id: gates
        shell: bash
        run: Scripts/verify-local.sh
      - name: Capture failure diagnostics without overwriting the original result
        if: ${{ failure() }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -uo pipefail
          DIR=.build/verification/failure-capture
          mkdir -p "$DIR"
          {
            date -u +%FT%TZ
            git rev-parse HEAD
            printf 'MALL_SIMULATOR_ID=%s\n' "${MALL_SIMULATOR_ID:-unset}"
            xcrun simctl list devices
            xcrun simctl list runtimes
          } > "$DIR/environment.txt" 2>&1 || true
          if [ -n "${MALL_SIMULATOR_ID:-}" ]; then
            xcrun simctl listapps "$MALL_SIMULATOR_ID" > "$DIR/listapps.txt" 2>&1 || true
            xcrun simctl io "$MALL_SIMULATOR_ID" screenshot "$DIR/simulator.png" > "$DIR/screenshot.log" 2>&1 || true
            xcrun simctl diagnose --udid="$MALL_SIMULATOR_ID" --output="$DIR/simulator-diagnose" --timeout=120 -b               > "$DIR/diagnose.log" 2>&1 || true
          fi
          # The verdict, tests.log and xcresult stay untouched; this directory is
          # additional evidence only. A diagnosis failure must not replace the
          # original test failure.
      - name: Summarize executed verification stages
        if: ${{ always() }}
        shell: bash
        run: |
          python3 Scripts/verification-timing.py report-all .build/verification >> "$GITHUB_STEP_SUMMARY"
          for report in .build/verification/*/verification-verdict.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          for log in .build/verification/*/tests.log; do
            if [ -f "$log" ]; then python3 Scripts/test-duration-summary.py "$log" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: "Verification verdict: ${{ steps.gates.outputs.verification_status }}"
        if: ${{ always() }}
        shell: bash
        env:
          MALL_VERDICT: ${{ steps.gates.outputs.verification_status }}
        run: |
          case "$MALL_VERDICT" in
            core-passed|core-passed-with-deferred|failed) printf '%s\n' "$MALL_VERDICT" ;;
            *) echo 'Missing verification verdict'; exit 1 ;;
          esac
      - name: Retain evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ios-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/verification/*.log
            .build/verification/*/*.log
            .build/verification/*/stage-timings.json
            .build/verification/*/stage-timings.md
            .build/verification/*/Tests.*.json
            .build/verification/*/test-scope.json
            .build/verification/*/test-enumeration.json
            .build/verification/failure-capture/**
            .build/verification/*/expected-tests.txt
            .build/verification/*/banner-audit.json
            .build/verification/*/native-results.json
            .build/verification/*/verification-verdict.json
            .build/verification/*/verification-verdict.md
            .build/verification/*/Tests.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Record remaining minimum-system coverage
        if: ${{ always() }}
        shell: bash
        run: echo 'iOS 17 compatibility is pending a physical-device run; this workflow validates iOS 27.0.' >> "$GITHUB_STEP_SUMMARY"

  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [classify, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require every verification job to succeed
        env:
          MALL_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 Scripts/check-ci-results.py
